<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF9F5" />
  <title>Neuton</title>
  <link rel="icon" href="./assets/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Neuton" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>

<body>
  <div id="root"></div>
  <script type="module">
    import { initializeFaro, getWebInstrumentations } from '@grafana/faro-web-sdk';
    import { TracingInstrumentation } from '@grafana/faro-web-tracing';

    const collector = import.meta.env.VITE_FARO_COLLECTOR_URL;
    const collectorToken = import.meta.env.VITE_FARO_TOKEN;
    if (collector && collectorToken) {
      try {
        initializeFaro({
          url: collector + '/' + collectorToken,
          app: {
            name: 'Neuton-Front',
            environment: import.meta.env.MODE,
            version: import.meta.env.VITE_APP_VERSION || 'dev',
          },
          instrumentations: [
            ...getWebInstrumentations(),
            new TracingInstrumentation(),
          ],
        });
      } catch (err) {
        console.error('[faro] failed to initialize', err);
      }
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
